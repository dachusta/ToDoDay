# https://pnpm.io/settings

# Окружение песочницы: создание симлинков на этой машине требует прав администратора или
# включённого режима разработчика Windows (текущий токен без прав, режим выключен),
# поэтому изолированный линкер pnpm падал с EPERM на symlink. hoisted-линкер собирает
# плоский node_modules через хардлинки и копирование и не требует elevation.
nodeLinker: hoisted

allowBuilds:
  core-js: true
  electron-winstaller: true
  esbuild: true
  lightningcss: true
  rolldown: true
  unrs-resolver: true
  # vue-demi выполняет postinstall при установке (этап 0)
  vue-demi: true

# '@parcel/watcher' не собирается: его install-скрипт запускает вложенный spawn с pipe,
# что в песочнице DSH даёт spawn EPERM. Watch-режим Vite/Quasar работает без нативного
# вотчера (chokidar). В обычном окружении строку можно убрать.
ignoredBuiltDependencies:
  - '@parcel/watcher'

# Пропущенный build-скрипт — предупреждение, а не ошибка установки: pnpm 11 по умолчанию
# падает с ERR_PNPM_IGNORED_BUILDS, и `pnpm install --frozen-lockfile` в CI (чистый
# node_modules, Ubuntu) обрывался на '@parcel/watcher' из списка выше. Локально ошибка
# не видна: при готовом node_modules установка выходит сразу («Already up to date»).
strictDepBuilds: false
